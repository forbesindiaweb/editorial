<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Published — Forbes India Editorial</title>
  <style>
    :root {
      --fi-red:    #E02020;
      --ink:       #111;
      --ink-mid:   #444;
      --ink-light: #888;
      --rule:      #e0e0e0;
      --bg:        #f7f7f5;
      --bg-card:   #fff;
      --masthead:  #0d0d0d;
      --green:     #1db954;
      --font-head: 'Georgia','Times New Roman',serif;
      --font-ui:   -apple-system,'Helvetica Neue',Arial,sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-ui); background: var(--bg); color: var(--ink); }
    a { color: inherit; text-decoration: none; }

    /* Masthead */
    .masthead {
      background: var(--masthead); color: #fff;
      padding: 0 24px; height: 52px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
      border-bottom: 3px solid var(--fi-red);
    }
    .masthead-left { display: flex; align-items: center; gap: 16px; }
    .logo { font-family: var(--font-head); font-size: 18px; }
    .logo span { color: var(--fi-red); }
    .sep { width: 1px; height: 20px; background: #444; }
    .page-title { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: #aaa; }
    .live-badge { display: flex; align-items: center; gap: 7px; font-size: 11px; color: #bbb; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
    .live-dot.paused { background: #555; animation: none; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.75)} }
    #countdown { color: #fff; font-weight: 700; }

    /* Progress bar */
    .pbar-wrap { height: 2px; background: #ddd; }
    .pbar { height: 100%; background: var(--fi-red); transform-origin: left; }

    /* Back */
    .back {
      display: flex; align-items: center; gap: 5px;
      padding: 0 24px; height: 34px;
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em;
      color: #888; background: #f2f2f0; border-bottom: 1px solid var(--rule);
    }
    .back:hover { color: var(--fi-red); }

    /* Stats */
    .stats { display: flex; gap: 1px; background: var(--rule); border-bottom: 1px solid var(--rule); }
    .stat { flex: 1; background: #fff; padding: 10px 20px; display: flex; align-items: baseline; gap: 6px; }
    .stat-n { font-family: var(--font-head); font-size: 22px; font-weight: bold; }
    .stat-l { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-light); }

    /* Controls */
    .controls {
      background: #fff; border-bottom: 1px solid var(--rule);
      padding: 10px 24px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .search-wrap { position: relative; flex: 1; min-width: 180px; max-width: 320px; }
    .search-wrap svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--ink-light); pointer-events: none; }
    input[type=search] {
      width: 100%; padding: 7px 10px 7px 30px; border: 1px solid var(--rule);
      border-radius: 4px; font-size: 13px; font-family: var(--font-ui);
      background: var(--bg); outline: none;
    }
    input[type=search]:focus { border-color: var(--fi-red); background: #fff; }
    .toggle-bc {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--ink-mid); cursor: pointer; user-select: none;
      padding: 6px 10px; border: 1px solid var(--rule); border-radius: 4px;
      background: var(--bg); transition: background .12s, border-color .12s;
    }
    .toggle-bc:hover { border-color: #aaa; }
    .toggle-bc.active { background: #fff3f3; border-color: var(--fi-red); color: var(--fi-red); font-weight: 600; }
    .count-badge { margin-left: auto; font-size: 12px; color: var(--ink-light); white-space: nowrap; }
    .count-badge strong { color: var(--ink); }

    /* Error */
    .err {
      margin: 14px 24px; padding: 10px 14px; border-radius: 4px;
      background: #fff3f3; border: 1px solid #fca5a5; color: #b91c1c;
      font-size: 13px; display: flex; align-items: center; gap: 8px;
    }

    /* Table */
    .layout { padding: 16px 24px; }
    .section-hd { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
    .section-hd h2 { font-family: var(--font-head); font-size: 17px; }
    .section-hd .sub { font-size: 12px; color: var(--ink-light); }

    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; font-size: 13px; }
    thead tr { background: #f2f2f0; border-bottom: 2px solid var(--rule); }
    th { padding: 9px 12px; text-align: left; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-light); white-space: nowrap; }
    tbody tr { border-bottom: 1px solid #f0f0ee; transition: background .1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fafaf8; }
    tbody tr.new-row { animation: slideIn .4s ease-out; }
    @keyframes slideIn { from{opacity:0;transform:translateY(-5px);background:#fff8f8} to{opacity:1;transform:translateY(0)} }
    td { padding: 10px 12px; vertical-align: middle; }

    .td-id { width: 80px; color: var(--ink-light); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .td-title a {
      font-family: var(--font-head); font-size: 14px; line-height: 1.35; color: var(--ink); display: block;
    }
    .td-title a:hover { color: var(--fi-red); text-decoration: underline; }
    .td-url { width: 260px; }
    .url-text { font-size: 11px; color: #777; word-break: break-all; line-height: 1.4; }
    .bc-tag { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 1px 6px; border-radius: 2px; background: #fff0e0; color: #b85c00; margin-top: 3px; }
    .td-copy { width: 36px; text-align: center; }
    .icon-btn {
      width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--rule);
      background: none; display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--ink-light);
      transition: background .12s, color .12s, border-color .12s;
    }
    .icon-btn:hover { background: var(--fi-red); color: #fff; border-color: var(--fi-red); }

    .state-box { padding: 50px; text-align: center; color: var(--ink-light); background: #fff; border: 1px solid var(--rule); border-radius: 4px; }
    .state-box .icon { font-size: 28px; margin-bottom: 10px; }

    @media(max-width:700px) {
      .td-url { display: none; }
      .stats .stat:last-child { display: none; }
      .controls { padding: 10px 16px; }
      .layout { padding: 12px 16px; }
      .back { padding: 0 16px; }
      .masthead { padding: 0 16px; }
    }
  </style>
</head>
<body>

<header class="masthead">
  <div class="masthead-left">
    <img src="https://images.forbesindia.com/blog/wp-content/uploads/2025/10/forbeslogo-1-2025-10-8c82c269e82b0027d98922ffd47a4f98.png" alt="Forbes India" style="height:22px;display:block;" />
    <div class="sep"></div>
    <div class="page-title">Published Articles</div>
  </div>
  <div class="live-badge">
    <div class="live-dot" id="liveDot"></div>
    <span>Refreshes in <span id="countdown">60</span>s</span>
  </div>
</header>

<div class="pbar-wrap"><div class="pbar" id="pbar"></div></div>

<a href="../story-tracker/" class="back">
  <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="7,2 3,6 7,10"/></svg>
  Story Tracker
</a>

<div class="stats">
  <div class="stat"><span class="stat-n" id="statTotal">—</span><span class="stat-l">Fetched</span></div>
  <div class="stat"><span class="stat-n" id="statShowing">—</span><span class="stat-l">Showing</span></div>
  <div class="stat"><span class="stat-n" id="statBC">—</span><span class="stat-l">Brand Connect</span></div>
  <div class="stat"><span class="stat-n" id="statFetch">—</span><span class="stat-l">Last updated</span></div>
</div>

<div class="controls">
  <div class="search-wrap">
    <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="6" r="4.5"/><line x1="9.5" y1="9.5" x2="13" y2="13"/></svg>
    <input type="search" id="searchInput" placeholder="Search title…" />
  </div>
  <button class="toggle-bc" id="toggleBC" title="Toggle Brand Connect visibility">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 6.5h11M6.5 1v11"/></svg>
    Show Brand Connect
  </button>
  <div class="count-badge" id="countBadge"></div>
</div>

<div id="errWrap" style="display:none" class="err">
  <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 10a1 1 0 110-2 1 1 0 010 2zm0-3V4"/></svg>
  <span id="errMsg"></span>
</div>

<div class="layout">
  <div class="section-hd">
    <h2>Latest Published</h2>
    <span class="sub" id="secSub"></span>
  </div>
  <div id="tableWrap">
    <div class="state-box" id="stateBox"><div class="icon">⟳</div><p>Fetching…</p></div>
    <table id="artTable" style="display:none">
      <thead>
        <tr>
          <th>Story ID</th>
          <th>Title</th>
          <th>URL</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="artTbody"></tbody>
    </table>
  </div>
</div>

<script>
const API      = 'https://api.forbesindia.com/nodeapi/v1/frb/get-article-list';
const INTERVAL = 60;

let allArticles = [];
let showBC      = false;   // brand-connect hidden by default
let knownIds    = new Set();
let cdVal       = INTERVAL;
let cdTimer     = null;
let refTimer    = null;

const $tbody    = document.getElementById('artTbody');
const $table    = document.getElementById('artTable');
const $state    = document.getElementById('stateBox');
const $err      = document.getElementById('errWrap');
const $errMsg   = document.getElementById('errMsg');
const $cd       = document.getElementById('countdown');
const $dot      = document.getElementById('liveDot');
const $pbar     = document.getElementById('pbar');
const $search   = document.getElementById('searchInput');
const $toggleBC = document.getElementById('toggleBC');
const $badge    = document.getElementById('countBadge');
const $total    = document.getElementById('statTotal');
const $showing  = document.getElementById('statShowing');
const $bcCount  = document.getElementById('statBC');
const $fetched  = document.getElementById('statFetch');
const $sub      = document.getElementById('secSub');

function isBrandConnect(art) {
  const u = (art.weburl || art.weburl_r || '').toLowerCase();
  return u.includes('brand-connect');
}

function getUrl(art) {
  const u = art.weburl || art.weburl_r || '';
  if (!u) return '';
  if (u.startsWith('http')) return u;
  return 'https://www.forbesindia.com' + (u.startsWith('/') ? u : '/' + u);
}

function renderRows() {
  const q = $search.value.trim().toLowerCase();

  const visible = allArticles.filter(a => {
    if (!showBC && isBrandConnect(a)) return false;
    if (q && !(a.display_headline || a.headline || '').toLowerCase().includes(q)) return false;
    return true;
  });

  if (!visible.length) {
    $table.style.display = 'none';
    $state.style.display = 'block';
    $state.innerHTML = '<div class="icon">🔍</div><p>No articles match.</p>';
  } else {
    $state.style.display = 'none';
    $table.style.display = 'table';
    $tbody.innerHTML = visible.map(a => {
      const isNew  = !knownIds.has(String(a.story_id)) && knownIds.size > 0;
      const title  = a.display_headline || a.headline || '(No title)';
      const url    = getUrl(a);
      const isBC   = isBrandConnect(a);
      const escUrl = url.replace(/"/g, '&quot;');
      return `<tr${isNew ? ' class="new-row"' : ''}>
        <td class="td-id">${a.story_id || '—'}</td>
        <td class="td-title">
          ${url ? `<a href="${escUrl}" target="_blank" rel="noopener">${title}</a>` : `<span>${title}</span>`}
        </td>
        <td class="td-url">
          <div class="url-text">${url || '—'}</div>
          ${isBC ? '<span class="bc-tag">Brand Connect</span>' : ''}
        </td>
        <td class="td-copy">
          <button class="icon-btn" title="Copy URL" onclick="copyUrl('${escUrl}',this)">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="7" height="7" rx="1"/><path d="M1 8V1h7v3"/></svg>
          </button>
        </td>
      </tr>`;
    }).join('');
    visible.forEach(a => knownIds.add(String(a.story_id)));
  }

  const bcTotal = allArticles.filter(isBrandConnect).length;
  $total.textContent   = allArticles.length;
  $showing.textContent = visible.length;
  $bcCount.textContent = bcTotal;
  $badge.innerHTML     = `<strong>${visible.length}</strong> of ${allArticles.length} articles`;
}

async function fetchBatch(minStoryId) {
  // Use the same filter format the API already supports
  let url = `${API}?count=50`;
  if (minStoryId) {
    // fetch articles with story_id less than minStoryId (older batch)
    url += `&filter=${encodeURIComponent(JSON.stringify({"story_id":{"$lt": String(minStoryId)}}))}`;
  }
  const res  = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  return Array.isArray(json) ? json
       : Array.isArray(json.data) ? json.data
       : Array.isArray(json.articles) ? json.articles : [];
}

async function load(showLoader) {
  if (showLoader) {
    allArticles = [];
    knownIds    = new Set();
    $table.style.display = 'none';
    $state.style.display = 'block';
    $state.innerHTML = '<div class="icon">⟳</div><p>Fetching…</p>';
  }
  $err.style.display = 'none';
  $dot.classList.remove('paused');

  try {
    const rows = await fetchBatch(null);
    allArticles = rows;
    $fetched.textContent = new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    $sub.textContent = `${allArticles.length} loaded · updated ${new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}`;
    renderRows();
    updateLoadMoreBtn();
  } catch(e) {
    console.error(e);
    $dot.classList.add('paused');
    $err.style.display = 'flex';
    $errMsg.textContent = `${e.message} — will retry in ${INTERVAL}s`;
    if (!allArticles.length) {
      $table.style.display = 'none';
      $state.style.display = 'block';
      $state.innerHTML = '<div class="icon">⚠️</div><p>Failed to load.</p>';
    }
  }
}

async function loadMore() {
  const $btn = document.getElementById('loadMoreBtn');
  $btn.disabled = true;
  $btn.textContent = 'Loading…';
  try {
    const minId = Math.min(...allArticles.map(a => Number(a.story_id)));
    const rows  = await fetchBatch(minId);
    if (rows.length) {
      // Deduplicate
      const existingIds = new Set(allArticles.map(a => String(a.story_id)));
      const newRows = rows.filter(r => !existingIds.has(String(r.story_id)));
      allArticles = allArticles.concat(newRows);
      $sub.textContent = `${allArticles.length} loaded · updated ${new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}`;
      renderRows();
      $btn.disabled = false;
      $btn.textContent = rows.length < 50 ? 'No more articles' : `Load 50 more`;
      if (rows.length < 50) $btn.disabled = true;
    } else {
      $btn.textContent = 'No more articles';
    }
  } catch(e) {
    $btn.disabled = false;
    $btn.textContent = 'Retry load more';
  }
}

function updateLoadMoreBtn() {
  const existing = document.getElementById('loadMoreBtn');
  if (existing) existing.remove();
  const btn = document.createElement('button');
  btn.id = 'loadMoreBtn';
  btn.textContent = 'Load 50 more';
  btn.style.cssText = `
    display:block; margin: 16px auto 4px;
    padding: 9px 28px; font-size: 13px; font-family: var(--font-ui);
    background: #fff; border: 1px solid #ccc; border-radius: 4px;
    cursor: pointer; color: #444; transition: background .12s, border-color .12s;
  `;
  btn.onmouseover = () => { btn.style.borderColor = 'var(--fi-red)'; btn.style.color = 'var(--fi-red)'; };
  btn.onmouseout  = () => { btn.style.borderColor = '#ccc'; btn.style.color = '#444'; };
  btn.onclick = loadMore;
  document.querySelector('.layout').appendChild(btn);
}

function startCountdown() {
  cdVal = INTERVAL;
  $cd.textContent = cdVal;
  $pbar.style.transition = 'none';
  $pbar.style.transform  = 'scaleX(1)';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $pbar.style.transition = `transform ${INTERVAL}s linear`;
    $pbar.style.transform  = 'scaleX(0)';
  }));
  clearInterval(cdTimer);
  cdTimer = setInterval(() => { $cd.textContent = Math.max(0, --cdVal); }, 1000);
  clearTimeout(refTimer);
  refTimer = setTimeout(() => load(false).then(startCountdown), INTERVAL * 1000);
}

$toggleBC.addEventListener('click', () => {
  showBC = !showBC;
  $toggleBC.classList.toggle('active', showBC);
  $toggleBC.innerHTML = showBC
    ? `<svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="2" y1="2" x2="11" y2="11"/><line x1="11" y1="2" x2="2" y2="11"/></svg> Hide Brand Connect`
    : `<svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 6.5h11M6.5 1v11"/></svg> Show Brand Connect`;
  renderRows();
});

$search.addEventListener('input', renderRows);

load(true).then(startCountdown);

window.copyUrl = (url, btn) => {
  if (!url) return;
  navigator.clipboard.writeText(url).then(() => {
    btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#1db954" stroke-width="2"><path d="M2 6l3 3 5-5"/></svg>`;
    setTimeout(() => { btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="7" height="7" rx="1"/><path d="M1 8V1h7v3"/></svg>`; }, 1500);
  });
};
</script>
</body>
</html>
